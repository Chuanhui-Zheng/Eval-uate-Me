<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">eval_uate_me — Agent Evaluation Harness</title>
  <desc id="desc">A visual banner showing evaluation cases flowing through an agent, graders, and a traceable report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182b"/>
      <stop offset="0.58" stop-color="#172744"/>
      <stop offset="1" stop-color="#123b43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70e1d1"/>
      <stop offset="1" stop-color="#9ef0a5"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b83ce"/>
      <stop offset="1" stop-color="#58d4c1"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b7d4fa" opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="url(#dots)" stroke="#9fb8dd" stroke-opacity="0.18"/>
  <circle cx="1080" cy="-15" r="210" fill="#3ac6b2" opacity="0.07"/>
  <circle cx="1050" cy="320" r="135" fill="#4f8de0" opacity="0.08"/>

  <g transform="translate(62 67)">
    <rect width="38" height="38" rx="11" fill="url(#accent)"/>
    <path d="M10 19h7l4-7 6 14 4-7h-2" fill="none" stroke="#10273a" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="116" y="95" fill="#c4d4ec" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2.2">OPEN-SOURCE AGENT EVALUATION</text>

  <text x="62" y="169" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="49" font-weight="750" letter-spacing="-1.4">eval_uate_me</text>
  <text x="64" y="211" fill="#d6e2f2" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500">Evaluate agents. Trust the evidence.</text>
  <rect x="64" y="239" width="54" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="277" fill="#9fb2cd" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Repeatable evals · Regression gates · Inspectable traces</text>

  <g transform="translate(585 90)">
    <path d="M126 65H165M270 65h38M413 65h38" fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="m157 59 8 6-8 6m143-12 8 6-8 6m143-12 8 6-8 6" fill="none" stroke="#6dd9cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <g>
      <rect width="126" height="112" rx="15" fill="#1c2d49" stroke="#7592bd" stroke-opacity="0.48"/>
      <rect x="17" y="17" width="28" height="28" rx="8" fill="#294c77"/>
      <path d="M25 25h12v12H25zM28 22v6m6-6v6m-9 3h6m3 0h6m-12 3h6m3 0h3" fill="none" stroke="#a9d4ff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="17" y="70" fill="#edf4ff" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="1">CASES</text>
      <text x="17" y="91" fill="#9fb2cd" font-family="Inter, sans-serif" font-size="12">known inputs</text>
    </g>
    <g transform="translate(165)">
      <rect width="105" height="112" rx="15" fill="#1c2d49" stroke="#7592bd" stroke-opacity="0.48"/>
      <rect x="17" y="17" width="28" height="28" rx="8" fill="#294c77"/>
      <circle cx="31" cy="28" r="4" fill="none" stroke="#a9d4ff" stroke-width="1.6"/>
      <path d="M23 39c1.7-5 14.3-5 16 0M31 32v4" fill="none" stroke="#a9d4ff" stroke-width="1.6" stroke-linecap="round"/>
      <text x="17" y="70" fill="#edf4ff" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="1">AGENT</text>
      <text x="17" y="91" fill="#9fb2cd" font-family="Inter, sans-serif" font-size="12">target system</text>
    </g>
    <g transform="translate(308)">
      <rect width="105" height="112" rx="15" fill="#1c2d49" stroke="#7592bd" stroke-opacity="0.48"/>
      <rect x="17" y="17" width="28" height="28" rx="8" fill="#294c77"/>
      <path d="m23 31 5 5 11-12" fill="none" stroke="#a9d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="17" y="70" fill="#edf4ff" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="1">GRADERS</text>
      <text x="17" y="91" fill="#9fb2cd" font-family="Inter, sans-serif" font-size="12">rules + judge</text>
    </g>
    <g transform="translate(451)">
      <rect width="105" height="112" rx="15" fill="#193a43" stroke="#65cbbd" stroke-opacity="0.7"/>
      <rect x="17" y="17" width="28" height="28" rx="8" fill="#21635e"/>
      <path d="M23 38V31h5v7m2 0V25h5v13m2 0V20h5v18" fill="none" stroke="#a1f0d8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="17" y="70" fill="#effffb" font-family="Inter, sans-serif" font-size="14" font-weight="700" letter-spacing="1">REPORT</text>
      <text x="17" y="91" fill="#9ed2cb" font-family="Inter, sans-serif" font-size="12">scores + traces</text>
    </g>

    <path d="M9 154h25l10-13 12 25 13-19 11 7h25m27 0h10m52 0h15m20 0h12m19 0h18m-44 0h6m73 0h18" fill="none" stroke="#68dcca" stroke-opacity="0.72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="518" cy="154" r="4" fill="#a1f0a6"/>
    <text x="0" y="193" fill="#8299b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.3">RUN  ·  INSPECT  ·  IMPROVE</text>
  </g>
