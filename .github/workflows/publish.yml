# Publishes to PyPI when a GitHub release is published, using PyPI "trusted publishing" (no token stored in GitHub).
# It does nothing until you set it up: see docs/RELEASING.md. It is skipped unless the repository variable
# PUBLISH_TO_PYPI is "true", so publishing is always a deliberate decision.
name: publish
on:
  release:
    types: [published]

jobs:
  build:
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
