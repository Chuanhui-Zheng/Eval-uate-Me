name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.11"}
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - if: runner.os == 'Linux' && matrix.python == '3.12'
        name: Type check and coverage floor
        run: |
          mypy
          pytest -q --cov=eval_uate_me
      # Smoke-test the installed command against a generated starter project.
      - if: runner.os == 'Linux'
        run: |
          eval_uate_me init /tmp/eval-smoke
          eval_uate_me check /tmp/eval-smoke/eval.toml
          eval_uate_me offline_case /tmp/eval-smoke/eval.toml --fail-under 0.6
      - if: runner.os == 'Linux'
        name: Build the wheel and check it installs and runs
        run: |
          pip install build twine
          python -m build
          twine check dist/*
          python -m venv /tmp/whl && /tmp/whl/bin/pip install dist/*.whl
          cd /tmp && /tmp/whl/bin/eval_uate_me init smoke && /tmp/whl/bin/eval_uate_me check smoke/eval.toml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker build -t eval_uate_me .
      # The sandbox itself: no network, read-only filesystem, non-root, limits, secrets hidden, timeouts kill the container.
      - run: |
          pip install -e ".[dev]"
          EVALHARNESS_DOCKER_TESTS=1 pytest tests/test_docker_isolation.py -q
      # --network none: the container has no network at all, so nothing can leave it.
      - run: |
          mkdir work && chmod 777 work
          docker run --rm --network none -v "$PWD/work:/work" eval_uate_me init proj
          docker run --rm --network none -v "$PWD/work/proj:/work" eval_uate_me check eval.toml
          docker run --rm --network none -v "$PWD/work/proj:/work" eval_uate_me run eval.toml --fail-under 0.5
