name: sync-to-hf

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
        run: |
          git remote add hf https://Chuanhui-Zheng:${HF_TOKEN}@huggingface.co/Chuanhui-Zheng/Eval_uate_Me
          git push hf main --force
