[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval_uate_me"
version = "1.0.0"
description = "A small, plugin-based eval harness"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["evaluation", "llm", "agents", "eval-harness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Chuanhui-Zheng/Eval-uate-Me"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10"]

[project.scripts]
eval_uate_me = "eval_uate_me.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eval_uate_me = ["py.typed"]   # PEP 561: downstream plugins get this package's types

[tool.pytest.ini_options]
testpaths = ["tests", "examples/cve_triage/tests", "examples/ticket_triage/tests", "examples/support_reply/tests"]
pythonpath = ["examples/cve_triage", "examples/ticket_triage", "examples/support_reply"]

[tool.mypy]
python_version = "3.11"
files = ["src/eval_uate_me"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.coverage.run]
source = ["eval_uate_me"]
omit = ["*/__main__.py"]

[tool.coverage.report]
# worker.py runs in a subprocess and is not measured; the Docker paths of isolation.py run only in the CI docker job
fail_under = 93
show_missing = true
skip_covered = true
