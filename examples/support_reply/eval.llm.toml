name = "support-reply-llm"
dataset = "data/cases.jsonl"
plugins = ["support_reply"]

[target]
type = "support_reply_llm"
model = "openai/gpt-4o-mini"
max_tokens = 512

[split]
dev_fraction = 0.5
salt = "support-reply-v1"

[selftest.oracle]
type = "support_reply"

[[graders]]
type = "llm_judge"
name = "reply_quality"
rubric = """Score this customer support reply out of 5.
5 = excellent: fully addresses the issue, concrete steps, right tone, no errors
4 = good: addresses the issue with minor gaps
3 = acceptable: partially addresses the issue or tone is slightly off
2 = poor: vague, unhelpful, or tone mismatched to urgency
1 = unacceptable: dismissive, blaming, empty, or completely off-topic"""
[graders.judge]
type = "openrouter"
model = "openai/gpt-4o-mini"

[[graders]]
type = "llm_judge"
name = "reply_dimensions"
rubric = "Evaluate this customer support reply on each dimension."
[[graders.dimensions]]
name = "addresses_issue"
description = "The reply directly addresses the customer's specific problem rather than giving a generic response."
[[graders.dimensions]]
name = "actionable"
description = "The reply gives the customer concrete next steps, a workaround, or a clear timeline — not just acknowledgement."
[[graders.dimensions]]
name = "appropriate_tone"
description = "The tone matches the urgency of the ticket. High-urgency tickets receive immediate, empathetic responses. Low-urgency tickets are helpful but not over-apologetic."
[graders.judge]
type = "openrouter"
model = "openai/gpt-4o-mini"

[gate]
significant_only = true
[gate.min]
pass_rate = 0.65
[gate.max_drop]
pass_rate = 0.10

[run]
output_dir = "runs-llm"
isolation = "process"
env_passthrough = ["OPENROUTER_API_KEY"]
