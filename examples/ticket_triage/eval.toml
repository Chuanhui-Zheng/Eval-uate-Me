name = "ticket-triage"
dataset = "data/cases.jsonl"
plugins = ["ticket_triage"]

[target]
type = "ticket_triage"

[split]
dev_fraction = 0.5
salt = "ticket-triage-v1"

[selftest.oracle]
type = "ticket_triage"

[[graders]]
type = "ticket_schema"
[[graders]]
type = "ticket_category"
[[graders]]
type = "ticket_urgency"

[[mutants]]
name = "wrong-category"
[mutants.target]
type = "ticket_triage"
flaw = "wrong_category"

[[mutants]]
name = "wrong-urgency"
[mutants.target]
type = "ticket_triage"
flaw = "wrong_urgency"

[[mutants]]
name = "always-low-urgency"
[mutants.target]
type = "ticket_triage"
flaw = "always_low"

[[mutants]]
name = "always-how-to"
[mutants.target]
type = "ticket_triage"
flaw = "always_how_to"

[gate]
significant_only = true
[gate.min]
pass_rate = 0.80
[gate.max_drop]
pass_rate = 0.10

[run]
output_dir = "runs"
