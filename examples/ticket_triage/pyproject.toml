[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-triage"
version = "1.0.0"
description = "Ticket triage example plugin for eval_uate_me"
requires-python = ">=3.11"
dependencies = ["eval_uate_me"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ticket_triage*"]
