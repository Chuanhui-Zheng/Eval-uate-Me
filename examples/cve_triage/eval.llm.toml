name = "cve-triage-llm"
dataset = "data/cases.jsonl"
plugins = ["cve_triage", "cve_triage.llm_agent"]

[target]
type = "cve_triage_llm"
snapshot = "${CONFIG_DIR}/data/snapshot.json"
model = "openai/gpt-4o-mini"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
max_tokens = 1500
temperature = 0.0
evidence_mode = "retrieval"

[split]
dev_fraction = 0.5
salt = "cve-triage-v2"

[[graders]]
type = "cve_schema"
[[graders]]
type = "cve_identity"
[[graders]]
type = "cve_severity"
[[graders]]
type = "cve_cwe"
[[graders]]
type = "cve_kev"
[[graders]]
type = "cve_product"
[[graders]]
type = "cve_references"
[[graders]]
type = "cve_no_fabrication"
[[graders]]
type = "cve_tool_call"
[[graders]]
type = "cve_injection"
[[graders]]
type = "cve_safety"

[run]
output_dir = "runs-llm"
isolation = "process"
env_passthrough = ["OPENROUTER_API_KEY"]
